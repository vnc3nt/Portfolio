<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-dark: #333;
            --text-gray: #555;
            --badge-apple: #007AFF;
            --badge-web: #ffffff;
            --badge-google: #3DDC84;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(45deg, #1a1a1a, #2c3e50, #000000, #4ca1af);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            width: 100%;
            padding: 40px 20px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
        }

        h1 {
            color: white;
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .login-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s;
        }

        .login-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Grid Container */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
            width: 100%;
            max-width: 1200px;
        }

        /* Die Kachel (Frosted Glass) */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            position: relative;
        }

        /* Hover Effekt */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 1px solid var(--glass-border);
        }

        .card-content {
            padding: 20px;
            background: rgba(255, 255, 255, 0.85); /* Hellerer Hintergrund für Lesbarkeit */
        }

        .card-title {
            margin: 0 0 5px 0;
            color: var(--text-dark);
            font-size: 1.2rem;
            font-weight: 600;
        }

        .card-desc {
            margin: 0;
            color: var(--text-gray);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        /* Badges Area */
        .badges {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: #333;
        }

        .badge.disabled {
            opacity: 0.2;
        }

        /* Badge Farben */
        .b-apple { background-color: var(--badge-apple); color: white; }
        .b-web { background-color: var(--badge-web); border: 1px solid #ccc; }
        .b-google { background-color: var(--badge-google); color: white; }

        /* Admin UI Overlay (Hidden by default) */
        #admin-panel {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
            z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 500px;
        }
        
        /* Backdrop for Modal */
        #modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 999;
        }

    </style>
</head>
<body>

    <header>
        <h1>MEIN PORTFOLIO</h1>
        <button class="login-btn" onclick="toggleLogin()">Admin Login</button>
    </header>

    <div class="grid-container" id="project-grid">
        </div>

    <div id="modal-backdrop"></div>
    <div id="admin-panel">
        <h2>Admin Login</h2>
        <p>Um die GitHub-API zu nutzen, geben Sie hier Ihren Personal Access Token ein.</p>
        <input type="password" placeholder="GitHub Token" style="width: 100%; padding: 10px; margin-bottom: 10px;">
        <button onclick="toggleLogin()" style="padding: 10px 20px; background: #333; color: white; border: none;">Verbinden</button>
    </div>

    <script>
        // Mock-Datenbank (Später: data.json im Repo)
        const projects = [
            {
                title: "Finance Tracker Pro",
                desc: "Eine komplexe Finanz-App mit React Native und Node.js Backend.",
                image: "https://via.placeholder.com/400x200/222/fff?text=App+Preview",
                url: "#",
                badges: { apple: true, web: false, google: true }
            },
            {
                title: "Portfolio V1",
                desc: "Die erste Version meines Portfolios, basierend auf reinem HTML.",
                image: "https://via.placeholder.com/400x200/333/fff?text=Web+Preview",
                url: "https://google.com",
                badges: { apple: false, web: true, google: false }
            },
            {
                title: "Smart Home Controller",
                desc: "IoT Dashboard zur Steuerung von Philips Hue Lampen.",
                image: "https://via.placeholder.com/400x200/444/fff?text=IoT+Preview",
                url: "#",
                badges: { apple: true, web: true, google: true }
            }
        ];

        const grid = document.getElementById('project-grid');

        function renderProjects() {
            grid.innerHTML = '';
            projects.forEach(proj => {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = proj.url;
                
                // Badges Logik
                const appleClass = proj.badges.apple ? '' : 'disabled';
                const webClass = proj.badges.web ? '' : 'disabled';
                const googleClass = proj.badges.google ? '' : 'disabled';

                card.innerHTML = `
                    <img src="${proj.image}" alt="${proj.title}" class="card-img">
                    <div class="card-content">
                        <h3 class="card-title">${proj.title}</h3>
                        <p class="card-desc">${proj.desc}</p>
                        <div class="badges">
                            <div class="badge b-apple ${appleClass}">A</div>
                            <div class="badge b-web ${webClass}">W</div>
                            <div class="badge b-google ${googleClass}">G</div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Init
        renderProjects();

        // Einfaches Modal Handling
        function toggleLogin() {
            const panel = document.getElementById('admin-panel');
            const drop = document.getElementById('modal-backdrop');
            const isVisible = panel.style.display === 'block';
            panel.style.display = isVisible ? 'none' : 'block';
            drop.style.display = isVisible ? 'none' : 'block';
        }
    </script>
</body>
</html>
